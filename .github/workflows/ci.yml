name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build standalone demo
        run: npm run build
      - name: Build docs page
        run: npm run docs
