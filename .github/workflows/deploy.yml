name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Tests must pass before deploy
        run: npm test
      - name: Assemble site (demo only, no node_modules)
        run: |
          mkdir -p _site
          npm run docs
          cp index.html agents.md _site/
          cp dist/docs.html _site/
          cp -r src assets _site/
          echo "usefoley.dev" > _site/CNAME
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
